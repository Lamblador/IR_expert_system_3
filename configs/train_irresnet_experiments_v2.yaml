# exp2 на dataset_v003 (честный val/test)
random_seed: 42
label_schema: structure_smarts
torch_epochs: 200
torch_batch_size: 32
torch_lr: 1.0e-5
torch_optimizer: adamw
torch_weight_decay: 0.0001
torch_scheduler: steplr
torch_scheduler_step_size: 75
torch_scheduler_gamma: 0.2
ir_hidden_size: 72
pos_weight_scale: 1.0
use_measurement_context: true
context_dropout_prob: 0.25
use_weighted_sampler: true
early_stop_metric: val_lrap
early_stop_patience: 20
early_stop_min_epochs: 10
augment_train: true
live_training_plot: true
model_version: v0.2.0.72
