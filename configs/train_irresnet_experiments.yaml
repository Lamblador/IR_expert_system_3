# Сравнительные эксперименты IrResnet4 (hidden=72, как v1.5.1.72)
random_seed: 42
train_frac: 0.85
torch_epochs: 100
torch_batch_size: 32
torch_lr: 0.001
torch_optimizer: adamw
torch_weight_decay: 0.0001
torch_momentum: 0.9
torch_loss: bce_with_logits
ir_hidden_size: 72
pos_weight_scale: 1.0
model_version: v0.2.0.72
use_measurement_context: true
early_stop_metric: val_f1_weighted
live_training_plot: true
train_log_tail: 5
