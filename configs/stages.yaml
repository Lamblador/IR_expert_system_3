# Профили стадий пайплайна (ir-pipeline run)
# paths: configs/paths.local.yaml | paths.huggingface.yaml | paths.colab.yaml

defaults:
  paths: configs/paths.huggingface.yaml
  dataset_version: dataset_mini
  rf_mode: spectrum_structure
  train_config: configs/train_mini.yaml
  train_config_torch: configs/train_mini.yaml
  preview_n_examples: 3
  preview_seed: 42
  hf_filename: dataset_mini.zip
  hf_extract_to: data/processed

stages:
  fetch:
    id: "01"
    description: "Скачать датасет с Hugging Face"
  dataset_build:
    id: "02"
    description: "Собрать датасет из JCAMP (локально)"
  dataset_preview:
    id: "03"
    description: "Превью спектров (метки spectrum/structure) и баланса классов"
  train_rf:
    id: "04"
    description: "Обучение RandomForest baseline"
  plot_rf_metrics:
    id: "05"
    description: "Графики MAE по полосам (RF)"
  evaluate_rf:
    id: "06"
    description: "Оценка RF на test split"
  predict_smoke:
    id: "07"
    description: "Smoke predict на одном JCAMP"

profiles:
  smoke:
    - fetch
    - dataset_preview
    - train_rf
    - plot_rf_metrics
  full_local:
    - dataset_build
    - dataset_preview
    - train_rf
    - plot_rf_metrics
    - evaluate_rf
