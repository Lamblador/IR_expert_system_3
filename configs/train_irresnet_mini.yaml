# Smoke / dataset_mini: короче, меньше hidden; те же метки SMARTS-only.
random_seed: 42
label_schema: structure_smarts
torch_epochs: 30
torch_batch_size: 32
torch_lr: 1.0e-5
torch_optimizer: adamw
torch_weight_decay: 0.0001
torch_scheduler: steplr
torch_scheduler_step_size: 30
torch_scheduler_gamma: 0.2
ir_hidden_size: 34
use_measurement_context: true
context_dropout_prob: 0.25
use_weighted_sampler: true
early_stop_metric: val_f1_weighted
early_stop_patience: 10
early_stop_min_epochs: 5
augment_train: true
model_version: v0.1.0.34
