# Colab smoke: сравнение M0/M1/M2
random_seed: 42
label_schema: structure_smarts
model_family: irresnet4
torch_epochs: 30
torch_batch_size: 32
torch_lr: 1.0e-5
torch_optimizer: adamw
torch_weight_decay: 0.0001
torch_scheduler: steplr
torch_scheduler_step_size: 30
torch_scheduler_gamma: 0.2
torch_loss: bce_with_logits
ir_hidden_size: 34
kan_grid_size: 5
kan_spline_order: 3
kan_full_hidden_size: 34
pos_weight_scale: 1.0
use_measurement_context: true
context_dropout_prob: 0.25
use_weighted_sampler: true
early_stop_metric: val_f1_weighted
early_stop_patience: 10
augment_train: true
live_training_plot: true
train_log_tail: 5
model_families:
  - irresnet4
  - kan_hybrid
  - kan_full
compare_hidden_size: 34
external_sdbs_npz: /content/drive/MyDrive/ir_data/external_sdbs/sdbs_eval.npz
